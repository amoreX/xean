name: Bug report
description: Report something that is broken or behaving unexpectedly.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please don't include secrets, private paths, project names you can't share,
        process command lines, or conversation contents. Replace them with placeholders.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the bug in a few sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that triggers the issue.
      placeholder: |
        1. Open xean from the menu bar
        2. Expand Build files
        3. Press ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Cleaner panel or native controls
        - Category lists or scanning
        - Manual Clean or individual Delete
        - Auto-clean or low-space warning
        - Worktrees or project dependencies
        - Docker build cache
        - Menu bar stats
        - Login or app lifetime
        - Build or launcher
        - Documentation
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: xean source commit
      description: Run git rev-parse --short HEAD in your checkout.
      placeholder: "e.g. 91a83d0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.5, Apple silicon"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Built with start.sh
        - Built with SwiftPM or another repository script
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Screenshots or logs help, as long as they contain no private information.

name: Feature request
description: Suggest an improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. xean is a compact menu bar cleaner. Describe the problem and how the change fits
        that workflow. Automatic cleanup must remain opt-in and preserve deletion safeguards.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would make this better?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Cleaner panel or native controls
        - Cleanup categories or scanning
        - Auto-clean or low-space warning
        - Menu bar stats
        - Settings or login
        - Build or distribution
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What workaround are you using now?
